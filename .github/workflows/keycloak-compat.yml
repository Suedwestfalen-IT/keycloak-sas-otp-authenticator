# Checks every new Keycloak release against the authenticator automatically.
#
# Once a day the newest final Keycloak release is looked up in Maven Central. If it is newer
# than keycloak.version in pom.xml and there is no issue for it yet, the authenticator is
# built and unit-tested against it, then the SAS end-to-end test (ci/sas-e2e) runs against
# that release, and the result is filed as an issue.
#
# Manually: Actions → "Keycloak compatibility" → Run workflow, optionally with a version.
# To check a version again: delete its issue or start the workflow manually.
name: Keycloak compatibility

on:
  schedule:
    - cron: "37 5 * * *"   # daily 05:37 UTC
  workflow_dispatch:
    inputs:
      keycloak_version:
        description: "Keycloak version to check (empty = newest)"
        required: false
        default: ""
      create_issue:
        description: "File the result as an issue (or comment on the existing one)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: keycloak-compat
  cancel-in-progress: false

jobs:
  detect:
    name: Detect new version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      baseline: ${{ steps.v.outputs.baseline }}
      title: ${{ steps.v.outputs.title }}
      run: ${{ steps.v.outputs.run }}
    steps:
      - uses: actions/checkout@v5

      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.keycloak_version }}
        run: |
          NEW="${INPUT_VERSION:-$(ci/latest-version.sh)}"
          BASE="$(sed -n 's:.*<keycloak.version>\(.*\)</keycloak.version>.*:\1:p' pom.xml | head -n 1)"
          TITLE="[kc-compat] Keycloak $NEW – compatibility check"
          RUN=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$NEW" = "$BASE" ]; then
              echo "Keycloak $NEW already is the base version – nothing to do."
              RUN=false
            elif [ "$(printf '%s\n%s\n' "$NEW" "$BASE" | sort -V | tail -n 1)" != "$NEW" ]; then
              echo "Keycloak $NEW is older than the base version $BASE – nothing to do."
              RUN=false
            elif [ -n "$(gh issue list --state all --limit 50 --search "Keycloak $NEW in:title" --json title \
                         --jq ".[] | select(.title | startswith(\"[kc-compat] Keycloak $NEW \")) | .title")" ]; then
              echo "There already is an issue for Keycloak $NEW – nothing to do."
              RUN=false
            fi
          fi
          echo "New: $NEW, base: $BASE, check: $RUN"
          {
            echo "version=$NEW"
            echo "baseline=$BASE"
            echo "title=$TITLE"
            echo "run=$RUN"
          } >> "$GITHUB_OUTPUT"

  check:
    name: Check Keycloak ${{ needs.detect.outputs.version }}
    needs: detect
    if: needs.detect.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WORK_DIR: ${{ github.workspace }}/.kc-compat
      NEW: ${{ needs.detect.outputs.version }}
      BASE: ${{ needs.detect.outputs.baseline }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Thales JARs
        env:
          THALES_JARS_PASSPHRASE: ${{ secrets.THALES_JARS_PASSPHRASE }}
        run: thales/decrypt.sh && thales/install.sh

      - name: Build + unit tests against Keycloak ${{ needs.detect.outputs.version }}
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p "$WORK_DIR"
          mvn -B --no-transfer-progress clean verify -Dkeycloak.version="$NEW" 2>&1 | tee "$WORK_DIR/build.log"

      - name: SAS e2e against Keycloak ${{ needs.detect.outputs.version }}
        id: e2e
        continue-on-error: true
        run: |
          set -o pipefail
          jar=$(ls target/keycloak-sas-otp-authenticator-*.jar 2>/dev/null | head -n 1)
          if [ -z "$jar" ]; then
            # tests failed: build the jar anyway, the e2e still tells whether it runs
            mvn -B -q clean package -DskipTests -Dkeycloak.version="$NEW" || { echo "no jar"; exit 1; }
            jar=$(ls target/keycloak-sas-otp-authenticator-*.jar | head -n 1)
          fi
          ci/sas-e2e/run.sh "$NEW" "$jar" 2>&1 | tee "$WORK_DIR/sas-e2e.log"

      - name: Report
        if: always()
        env:
          BUILD: ${{ steps.build.outcome }}
          E2E: ${{ steps.e2e.outcome }}
        run: |
          mkdir -p "$WORK_DIR"
          verdict() { [ "$1" = "success" ] && echo "**PASS**" || echo "**FAIL** ($1)"; }
          {
            echo "# Keycloak $NEW – compatibility check (keycloak-sas-otp-authenticator)"
            echo
            echo "Base: **$BASE** (\`keycloak.version\` in pom.xml) · New: **$NEW**"
            echo
            echo "Release information: [Upgrading guide $NEW](https://www.keycloak.org/docs/$NEW/upgrading/) · [Release notes on GitHub](https://github.com/keycloak/keycloak/releases/tag/$NEW)"
            echo
            echo "## Build + unit tests against $NEW: $(verdict "$BUILD")"
            echo
            echo '```'
            grep -E "Tests run:|BUILD|ERROR\]" "$WORK_DIR/build.log" 2>/dev/null | tail -n 30 || echo "no log"
            echo '```'
            echo
            echo "## SAS e2e against $NEW: $(verdict "$E2E")"
            echo
            echo '```'
            cat .sas-e2e/e2e.out 2>/dev/null || tail -n 40 "$WORK_DIR/sas-e2e.log" 2>/dev/null || echo "no output"
            echo '```'
            echo
            if [ "$BUILD" = "success" ] && [ "$E2E" = "success" ]; then
              echo "**Verdict:** Bump \`keycloak.version\` in pom.xml to $NEW, nothing else to do."
            else
              echo "**Verdict:** Needs a look before the Keycloak image moves to $NEW."
            fi
          } > "$WORK_DIR/report.md"
          cat "$WORK_DIR/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: kc-compat-report
          path: |
            .kc-compat/
            .sas-e2e/e2e.out
            .sas-e2e/keycloak.log
            .sas-e2e/sas-mock.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90

      - name: File issue
        if: always() && (github.event_name == 'schedule' || inputs.create_issue)
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ needs.detect.outputs.title }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="$RUNNER_TEMP/issue.md"
          cp "$WORK_DIR/report.md" "$body" 2>/dev/null || echo "The compatibility check did not produce a report (aborted)." > "$body"
          printf '\n\nWorkflow run with logs: %s\n' "$RUN_URL" >> "$body"
          existing=$(gh issue list --state all --limit 50 --search "Keycloak $NEW in:title" --json number,title \
                       --jq ".[] | select(.title | startswith(\"[kc-compat] Keycloak $NEW \")) | .number" | head -n 1)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$body"
          else
            gh issue create --title "$TITLE" --body-file "$body"
          fi

      - name: Result
        if: steps.build.outcome == 'failure' || steps.e2e.outcome == 'failure'
        run: |
          echo "::error::Keycloak $NEW: build/tests ${{ steps.build.outcome }}, SAS e2e ${{ steps.e2e.outcome }} – see the summary."
          exit 1
