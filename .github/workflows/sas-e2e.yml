# End-to-end test: the real Keycloak distribution with our jar and the Thales JARs, the SAS
# mock with real vendor crypto, the login played with curl. See ci/sas-e2e/run.sh.
name: SAS e2e

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      keycloak_version:
        description: "Keycloak version (empty = keycloak.version from pom.xml)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  e2e:
    name: Keycloak + SAS mock + curl
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Thales JARs
        env:
          THALES_JARS_PASSPHRASE: ${{ secrets.THALES_JARS_PASSPHRASE }}
        run: thales/decrypt.sh && thales/install.sh

      - name: Build provider jar and test classes
        env:
          INPUT_VERSION: ${{ inputs.keycloak_version }}
        run: mvn -B --no-transfer-progress -DskipTests ${INPUT_VERSION:+-Dkeycloak.version="$INPUT_VERSION"} package

      - name: Run end-to-end test
        env:
          INPUT_VERSION: ${{ inputs.keycloak_version }}
        run: |
          set -o pipefail
          ci/sas-e2e/run.sh ${INPUT_VERSION:+"$INPUT_VERSION"} 2>&1 | tee e2e-run.log

      - name: Report failures as annotations
        if: failure()
        run: |
          { grep -E "^FAIL |^\[e2e\]|ERROR|Traceback|Error" e2e-run.log; echo "--- tail:"; tail -n 15 e2e-run.log; } \
            | head -n 60 | while IFS= read -r line; do echo "::error::${line}"; done

      - name: Summary
        if: always()
        run: |
          {
            echo "### SAS e2e"
            echo
            echo '```'
            cat .sas-e2e/e2e.out 2>/dev/null || echo "no output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: sas-e2e
          path: |
            .sas-e2e/e2e.out
            .sas-e2e/keycloak.log
            .sas-e2e/sas-mock.log
            e2e-run.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
