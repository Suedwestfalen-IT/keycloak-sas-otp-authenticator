# Unit tests on every push and pull request, including SasEndToEndTest (production wrapper
# against the in-JVM SAS mock with the real vendor crypto). The Keycloak version is the one
# pinned in pom.xml; keycloak-compat.yml covers newer releases.
name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: mvn test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Thales JARs
        env:
          THALES_JARS_PASSPHRASE: ${{ secrets.THALES_JARS_PASSPHRASE }}
        run: thales/decrypt.sh && thales/install.sh

      - name: Build and run unit tests
        run: |
          set -o pipefail
          mvn -B --no-transfer-progress verify 2>&1 | tee build.log

      - name: Report failures as annotations
        if: failure()
        run: |
          grep -E "ERROR\]|FAILURE|Tests run:.*(Failures: [1-9]|Errors: [1-9])|<<< (FAILURE|ERROR)|expected:|but was:" build.log \
            | grep -vE "^\[ERROR\] *$|Re-run Maven|full stack trace|Help [0-9]|cwiki.apache.org|read the following" \
            | head -n 40 \
            | while IFS= read -r line; do echo "::error::${line}"; done

      - name: Summary
        if: always()
        run: |
          {
            echo "### Surefire"
            echo
            echo '```'
            cat target/surefire-reports/*.txt 2>/dev/null | grep -E "^Tests run|^Test set" || echo "no reports"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
